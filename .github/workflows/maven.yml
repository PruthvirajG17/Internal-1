
name: Maven Build and Docker Hub Push

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build Maven project and run tests
      - name: Maven Build and Test
        run: mvn clean verify

      # Step 4: Validate Docker Hub secrets
      - name: Check Docker Hub Credentials
        if: github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_1 }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_1 }}
        run: |
          if [ -z "$DOCKER_USERNAME_1" ]; then
            echo "Error: DOCKERHUB_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "Error: DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      # Step 5: Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Step 6: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_1 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_1 }}

      # Step 7: Build and Push Docker Image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_1 }}/internal-1:latest
